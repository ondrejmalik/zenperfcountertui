name: Implementation Task
description: A testable slice of an active milestone goal
labels: ["needs-triage"]
body:
  - type: input
    id: goal_id
    attributes:
      label: Goal Alignment (from GOALS.md)
      description: Exact Goal ID (e.g., G-01) and active milestone label (e.g., goal:v0.1-foundation).
      placeholder: "G-01 (goal:v0.1-foundation)"
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Target Architectural Layer
      description: Must match scripts/layers.json. Split across issues if spanning multiple layers.
      options:
        - core
        - platform
        - product
        - tool
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Problem & Scope
      description: Concrete description of the single behavior or capability to implement (reference the relevant docs/ARCHITECTURE_RULES.md section).
    validations:
      required: true

  - type: textarea
    id: touch_scope
    attributes:
      label: Touch Scope
      description: List each exact repository-relative path or directory as its own bullet in backticks. Include tests.
      placeholder: "- `crates/zen2top-core/src/packs.rs`"
    validations:
      required: true

  - type: input
    id: dependencies
    attributes:
      label: Depends On
      description: List issues whose delivery must merge first, or write none.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Verifiable Acceptance Criteria
      description: Checklist of observable outcomes that prove the task is complete.
      value: |
        - [ ] Behavior 1:
        - [ ] Behavior 2:
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Explicit Non-Goals / Out of Scope for This Issue
      description: Prevent scope creep by listing adjacent things the worker agent MUST NOT touch.
      placeholder: "Do not edit Cargo.toml; do not touch unrelated crates or HANDOFF.md."
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification Command / Oracle
      description: Exact test, headless command, or independent oracle that proves correctness.
      placeholder: "python scripts/ci.py all"
    validations:
      required: true

  - type: input
    id: size_estimate
    attributes:
      label: Estimated net production Rust LOC
      description: Most slices target 150–450 production LOC across one to three production files.
    validations:
      required: true
