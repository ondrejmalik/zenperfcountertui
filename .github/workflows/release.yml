name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and smoke-test without publishing)"
        default: "true"
        type: string
      tag:
        description: "Release tag when publishing via workflow_dispatch (e.g. v0.1.0)"
        default: "v0.1.0"
        type: string

permissions:
  contents: write

jobs:
  gate-and-build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Refuse release while any release-blocker issue is open
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $blockers = [int](gh issue list -R "$env:REPO" --state open --label "release-blocker" --json number --jq 'length')
          if ($blockers -gt 0) {
            Write-Error "::error::Release held by $blockers open release-blocker issue(s)."
            exit 1
          }
      - name: Run full verification, ratchet, and headless smoke test
        shell: pwsh
        run: python scripts/ci.py all
      - name: Build release binary and generate SHA256SUMS
        shell: pwsh
        run: |
          cargo build --release --locked -p zen2top-cli --bin zen2top
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\zen2top.exe dist\zen2top-windows-x64.exe
          "release-commit=$env:GITHUB_SHA" | Out-File -FilePath dist\BUILD_INFO.txt -Encoding utf8
          python -c "import hashlib, pathlib; d = pathlib.Path('dist'); lines = [f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in sorted(d.iterdir()) if p.is_file() and p.name != 'SHA256SUMS']; (d / 'SHA256SUMS').write_text('\n'.join(lines) + '\n', encoding='utf-8')"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          gh release upload "$tag" -R "$env:REPO" dist/* --clobber
          if ($LASTEXITCODE -ne 0) {
            gh release create "$tag" -R "$env:REPO" --target "$env:TARGET_SHA" dist/* --title "$tag" --generate-notes
          }
