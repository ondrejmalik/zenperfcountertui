name: claim command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  claim:
    if: >-
      startsWith(github.event.comment.body, '/claim') ||
      startsWith(github.event.comment.body, '/unclaim') ||
      startsWith(github.event.comment.body, '🤖 Agent: /expire-claim') ||
      startsWith(github.event.comment.body, '🤖 Agent: /claim') ||
      startsWith(github.event.comment.body, '🤖 Agent: /unclaim')
    concurrency:
      group: agent-queue-claims
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Process claim comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          BODY: ${{ github.event.comment.body }}
        run: |
          MODE=active
          if grep -iqE '^\s*paused\s*$' .github/council.txt .github/trusted-reviewers.txt; then
            MODE=paused
          fi
          MODE="$MODE" python3 scripts/gh_ci/claim_command.py
