[workspace]
resolver = "2"
members = [
    "crates/zen2top-core",
    "crates/zen2top-platform",
    "crates/zen2top-cli",
]
exclude = [
    "third_party/rminject",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.84"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.dev]
debug = "line-tables-only"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"
